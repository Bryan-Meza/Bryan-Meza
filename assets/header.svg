<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="272" viewBox="0 0 1000 272" fill="none" role="img" aria-label="Terminal: whoami prints Bryan; cat role.txt prints Software Engineer">
  <style>
    .t { font-family: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; }
