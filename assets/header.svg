<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" fill="none" role="img" aria-label="Hi, I'm Bryan. Software Engineer">
  <style>
    .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .hello { font-size: 15px; letter-spacing: 6px; fill: #7D8FB3; opacity: 0; animation: rise .8s ease-out .2s forwards; }
    .name  { font-size: 84px; font-weight: 700; letter-spacing: 2px; opacity: 0; animation: rise .9s ease-out .45s forwards; }
    .role  { font-size: 24px; fill: #C9D1D9; }
    .prompt { fill: #3FB950; }
    .cursor { fill: #58A6FF; animation: blink 1s step-end infinite; }
    .grid  { animation: drift 12s linear infinite; }
    .orb1  { animation: float1 9s ease-in-out infinite alternate; }
    .orb2  { animation: float2 11s ease-in-out infinite alternate; }
    .scan  { animation: scan 6s linear infinite; }
    @keyframes rise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink  { 50% { opacity: 0; } }
    @keyframes drift  { from { transform: translate(0, 0); } to { transform: translate(-40px, -40px); } }
    @keyframes float1 { from { transform: translate(0, 0); } to { transform: translate(120px, 30px); } }
    @keyframes float2 { from { transform: translate(0, 0); } to { transform: translate(-140px, -20px); } }
    @keyframes scan   { 0% { transform: translateY(-20px); opacity: 0; } 10% { opacity: 1; } 60% { opacity: 1; } 70%, 100% { transform: translateY(260px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .grid, .orb1, .orb2, .scan, .cursor,
      .hello, .name { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1000" height="240" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0D1530"/>
    </linearGradient>
    <pattern id="gridp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#58A6FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <radialGradient id="blue"><stop offset="0" stop-color="#1F6FEB" stop-opacity="0.45"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop offset="0" stop-color="#8957E5" stop-opacity="0.4"/><stop offset="1" stop-color="#8957E5" stop-opacity="0"/></radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.35" stop-color="#E6EDF3"/>
      <stop offset="0.65" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#58A6FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="typeClip"><rect x="363" y="150" width="0" height="40"><animate attributeName="width" values="0.0;14.4;28.9;43.3;57.8;72.2;86.7;101.1;115.6;130.0;144.5;158.9;173.4;187.8;202.3;216.8;231.2;245.6;260.1;274.6" keyTimes="0.0000;0.0526;0.1053;0.1579;0.2105;0.2632;0.3158;0.3684;0.4211;0.4737;0.5263;0.5789;0.6316;0.6842;0.7368;0.7895;0.8421;0.8947;0.9474;1.0000" calcMode="discrete" begin="1.2s" dur="1.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <g class="grid"><rect width="1080" height="320" fill="url(#gridp)"/></g>
    <g class="orb1"><circle cx="180" cy="60" r="220" fill="url(#blue)"/></g>
    <g class="orb2"><circle cx="840" cy="200" r="240" fill="url(#violet)"/></g>
    <g class="scan"><rect x="0" y="0" width="1000" height="1.5" fill="url(#scanGrad)"/></g>
    <!-- corner brackets -->
    <g stroke="#58A6FF" stroke-opacity="0.55" stroke-width="2">
      <path d="M24 52V24H52"/><path d="M976 52V24H948"/>
      <path d="M24 188V216H52"/><path d="M976 188V216H948"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="239" rx="18" stroke="#30363D"/>

  <text x="500" y="62" text-anchor="middle" class="mono hello">HELLO, I'M</text>
  <text x="500" y="140" text-anchor="middle" class="sans name" fill="url(#nameGrad)">Bryan</text>

  <g clip-path="url(#typeClip)">
    <text x="363" y="180" class="mono role"><tspan class="prompt">&gt; </tspan>Software Engineer</text>
  </g>
  <rect class="cursor" x="363" y="162" width="11" height="24" fill="#58A6FF"><animate attributeName="x" values="363.0;377.4;391.9;406.3;420.8;435.2;449.7;464.1;478.6;493.0;507.5;521.9;536.4;550.8;565.3;579.8;594.2;608.6;623.1;637.6" keyTimes="0.0000;0.0526;0.1053;0.1579;0.2105;0.2632;0.3158;0.3684;0.4211;0.4737;0.5263;0.5789;0.6316;0.6842;0.7368;0.7895;0.8421;0.8947;0.9474;1.0000" calcMode="discrete" begin="1.2s" dur="1.6s" fill="freeze"/></rect>
</svg>
