<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="272" viewBox="0 0 1000 272" fill="none" role="img" aria-label="Terminal: whoami prints Bryan; cat role.txt prints Software Engineer">
  <style>
    .t { font-family: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; }
    .user { fill: #3FB950; font-weight: 600; }
    .path { fill: #58A6FF; font-weight: 600; }
    .dim  { fill: #8B949E; }
    .cmd  { fill: #E6EDF3; }
    .name { font-family: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 54px; font-weight: 700; fill: #58A6FF; }
    .role { font-family: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 22px; fill: #E6EDF3; }
    .title { font-family: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8B949E; }
    .cur  { fill: #E6EDF3; }
    .blink { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <clipPath id="win"><rect width="1000" height="272" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="1000" height="272" fill="#0D1117"/>
    <rect width="1000" height="40" fill="#161B22"/>
    <line x1="0" y1="40.5" x2="1000" y2="40.5" stroke="#30363D"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="271" rx="12" stroke="#30363D"/>
  <circle cx="24" cy="20" r="6.5" fill="#FF5F57"/>
  <circle cx="46" cy="20" r="6.5" fill="#FEBC2E"/>
  <circle cx="68" cy="20" r="6.5" fill="#28C840"/>
  <text x="500.0" y="25" text-anchor="middle" class="title">bryan@github: ~</text>

  <clipPath id="c80"><rect x="204.8" y="60" width="0" height="28">
    <animate attributeName="width" values="0.0;10.8;21.6;32.4;43.2;54.0;84.8" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" calcMode="discrete" begin="0.6s" dur="0.42s" fill="freeze"/></rect></clipPath>
  <g opacity="0"><set attributeName="opacity" to="1" begin="0.25s" fill="freeze"/>
    <text x="32" y="80" class="t"><tspan class="user">bryan@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan></text>
    <text x="204.8" y="80" class="t cmd" clip-path="url(#c80)">whoami</text>
    <rect x="204.8" y="65" width="10.8" height="19" class="cur" opacity="1">
      <animate attributeName="x" values="204.8;215.6;226.4;237.2;248.0;258.8;269.6" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" calcMode="discrete" begin="0.6s" dur="0.42s" fill="freeze"/>
      <set attributeName="visibility" to="hidden" begin="1.17s" fill="freeze"/>
    </rect>
  </g>
  <text x="32" y="142" class="name" opacity="0">Bryan<set attributeName="opacity" to="1" begin="1.27s" fill="freeze"/></text>

  <clipPath id="c186"><rect x="204.8" y="166" width="0" height="28">
    <animate attributeName="width" values="0.0;10.8;21.6;32.4;43.2;54.0;64.8;75.6;86.4;97.2;108.0;118.8;149.6" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" calcMode="discrete" begin="1.92s" dur="0.84s" fill="freeze"/></rect></clipPath>
  <g opacity="0"><set attributeName="opacity" to="1" begin="1.57s" fill="freeze"/>
    <text x="32" y="186" class="t"><tspan class="user">bryan@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan></text>
    <text x="204.8" y="186" class="t cmd" clip-path="url(#c186)">cat role.txt</text>
    <rect x="204.8" y="171" width="10.8" height="19" class="cur" opacity="1">
      <animate attributeName="x" values="204.8;215.6;226.4;237.2;248.0;258.8;269.6;280.4;291.2;302.0;312.8;323.6;334.4" keyTimes="0.0000;0.0833;0.1667;0.2500;0.3333;0.4167;0.5000;0.5833;0.6667;0.7500;0.8333;0.9167;1.0000" calcMode="discrete" begin="1.92s" dur="0.84s" fill="freeze"/>
      <set attributeName="visibility" to="hidden" begin="2.91s" fill="freeze"/>
    </rect>
  </g>
  <text x="32" y="218" class="role" opacity="0">Software Engineer<set attributeName="opacity" to="1" begin="3.01s" fill="freeze"/></text>
  <g opacity="0"><set attributeName="opacity" to="1" begin="3.36s" fill="freeze"/>
    <text x="32" y="252" class="t"><tspan class="user">bryan@github</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan></text>
    <rect x="204.8" y="237" width="10.8" height="19" class="cur blink"/>
  </g>
</svg>
